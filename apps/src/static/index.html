<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareCloud Patient Portal (demo)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #f6f8fa; color: #1f2328; }
  h1 { font-size: 1.4rem; }
  .note { color: #656d76; font-size: .9rem; }
  .synth { background: #fff8c5; border: 1px solid #d4a72c; padding: .4rem .7rem; border-radius: 6px; font-size: .9rem; max-width: 900px; }
  table { border-collapse: collapse; background: #fff; width: 100%; max-width: 900px; margin-top: .5rem; }
  th, td { padding: .4rem .7rem; border-bottom: 1px solid #d0d7de; text-align: left; font-size: .92rem; }
  tr.row { cursor: pointer; } tr.row:hover { background: #eef4ff; }
  #status { margin: 1rem 0; font-weight: 600; }
  #detail { max-width: 900px; margin-top: 1rem; }
</style>
</head>
<body>
<h1>CareCloud Patient Portal</h1>
<p class="synth">Synthea synthetic data only: these are invented patients produced by the Synthea generator, not real people. Node A of the Distributed Cyber-Resilience Platform demo.</p>
<div id="status">Loading...</div>
<table><thead><tr><th>MRN</th><th>Name</th><th>DOB</th><th>Sex</th><th>Main condition</th></tr></thead>
<tbody id="rows"></tbody></table>
<div id="detail"></div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load() {
  const status = document.getElementById('status');
  try {
    const r = await fetch('/api/patients?limit=15');
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    status.textContent = `OK - showing ${d.patients.length} of ${d.total} Synthea patients (served by ${d.served_by})`;
    document.getElementById('rows').innerHTML = d.patients.map(p =>
      `<tr class="row" data-mrn="${esc(p.mrn)}"><td>${esc(p.mrn)}</td><td>${esc(p.name)}</td><td>${esc(p.dob)}</td><td>${esc(p.gender)}</td><td>${esc(p.condition)}</td></tr>`).join('');
  } catch (e) {
    status.textContent = 'Service degraded: ' + e.message;
  }
}
async function open(mrn) {
  const box = document.getElementById('detail');
  box.innerHTML = 'Loading ' + esc(mrn) + '...';
  const [labs, meds] = await Promise.all([fetch('/api/labs?mrn=' + encodeURIComponent(mrn)).then(r => r.json()), fetch('/api/medications?mrn=' + encodeURIComponent(mrn)).then(r => r.json())]);
  box.innerHTML = `<h3>${esc(mrn)}: laboratory results</h3><table>${(labs.results || []).slice(0, 8).map(l => `<tr><td>${esc(l.date)}</td><td>${esc(l.test)}</td><td>${esc(l.value)} ${esc(l.units)}</td></tr>`).join('') || '<tr><td>none on file</td></tr>'}</table>` +
    `<h3>Active medications</h3><table>${(meds.medications || []).map(m => `<tr><td>${esc(m.since)}</td><td>${esc(m.description)}</td><td>${esc(m.reason)}</td></tr>`).join('') || '<tr><td>none on file</td></tr>'}</table><p class="note">Synthea synthetic data.</p>`;
}
document.addEventListener('click', e => { const tr = e.target.closest('tr.row'); if (tr) open(tr.dataset.mrn); });
load(); setInterval(load, 5000);
</script>
</body>
</html>
