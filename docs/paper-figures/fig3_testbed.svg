<path d="M260,306 L260,350" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M780,270 L780,227" fill="none" stroke="#fff" stroke-width="5.2"/>
<path d="M780,270 L780,227" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M780,332 L780,375" fill="none" stroke="#fff" stroke-width="5.2"/>
<path d="M780,332 L780,375" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M330,70 L330,88 L260,88 L260,105" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M710,70 L710,88 L780,88 L780,105" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#a)"/>
</svg>
