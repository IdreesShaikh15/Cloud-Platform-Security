<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" font-family="Arial, Helvetica, FreeSans, 'Liberation Sans', sans-serif">
<title>Fig. Experimental testbed</title>
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>

<rect x="220" y="12" width="600" height="58" rx="0" fill="#f2f2f2" stroke="#000" stroke-width="1.2"/>
<text x="520.0" y="45.9" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Agent code (identical in both environments)</text>
<text x="520" y="58" font-size="12" text-anchor="middle" fill="#000" font-style="italic">signing, gRPC + mTLS, trust, voting, certificates, admission logic</text>
<rect x="15" y="105" width="490" height="355" rx="0" fill="#fafafa" stroke="#000" stroke-width="1.4"/>
<text x="260" y="128" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Simulator</text>
<rect x="40" y="150" width="440" height="56" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="260.0" y="174.4" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Synthetic world</text>
<text x="260.0" y="190.7" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">generates telemetry and injected attacks</text>
<rect x="40" y="250" width="440" height="56" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="260.0" y="274.4" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Real agents A-D</text>
<text x="260.0" y="290.7" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">run in-process with real signatures and gRPC/mTLS</text>
<rect x="40" y="350" width="440" height="56" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="260.0" y="374.4" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">FakeBackend</text>
<text x="260.0" y="390.7" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">simulated Kubernetes API and pod replacement</text>
<text x="272" y="232" font-size="11" text-anchor="start" fill="#000" font-style="italic">telemetry</text>
<text x="272" y="332" font-size="11" text-anchor="start" fill="#000" font-style="italic">actions</text>
<text x="260" y="435" font-size="12" text-anchor="middle" fill="#000" font-style="italic">20 seeded runs per scenario, 1,140 trials in total; shorter timers</text>
<rect x="535" y="105" width="490" height="355" rx="0" fill="#fafafa" stroke="#000" stroke-width="1.4"/>
<text x="780" y="128" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Kubernetes sandbox</text>
<text x="780" y="146" font-size="12" text-anchor="middle" fill="#000">Minikube, 4 nodes, Calico, Kubernetes 1.34.12</text>
<rect x="555" y="165" width="450" height="62" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="780.0" y="192.4" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Namespace healthcare</text>
<text x="780.0" y="208.7" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">workloads A-F and a traffic client (Synthea data)</text>
<rect x="555" y="270" width="450" height="62" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="780.0" y="297.4" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Namespace resilience</text>
<text x="780.0" y="313.7" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">agents A-D, dashboard, two webhook replicas</text>
<rect x="555" y="375" width="450" height="56" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="780.0" y="399.4" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Kubernetes API (K8sBackend)</text>
<text x="780.0" y="415.7" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">NetworkPolicy, Deployment updates</text>
<text x="792" y="253" font-size="11" text-anchor="start" fill="#000" font-style="italic">monitor</text>
<text x="792" y="357" font-size="11" text-anchor="start" fill="#000" font-style="italic">certificate-checked actions</text>
<text x="780" y="448" font-size="12" text-anchor="middle" fill="#000" font-style="italic">harmless tripwire only; single runs</text>
<rect x="15" y="490" width="1010" height="100" rx="0" fill="#fff" stroke="#000" stroke-width="1.2" stroke-dasharray="6,4"/>
<text x="520" y="520" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Authors' own four-node cluster (Kubernetes 1.37.0)</text>
<text x="520" y="545" font-size="12.5" text-anchor="middle" fill="#000">dashboard and normal-operation monitoring screenshots only; no attack was run here</text>
<text x="520" y="566" font-size="12.5" text-anchor="middle" fill="#000" font-style="italic">Results from the three environments are reported separately.</text>
