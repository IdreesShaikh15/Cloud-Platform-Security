<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1482" viewBox="0 0 1350 1482" font-family="Arial, Helvetica, FreeSans, 'Liberation Sans', sans-serif">
<title>Fig. 2 Containment and recovery workflow</title>
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>

<rect x="180.0" y="24" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="55.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Suspicious Workload Detected</text>
<rect x="180.0" y="112" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="143.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Generate Security Evidence</text>
<rect x="180.0" y="200" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="231.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Authenticate Evidence Using Ed25519</text>
<rect x="180.0" y="288" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="319.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Trust-Weighted Evidence Correlation</text>
<rect x="180.0" y="376" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="407.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Three-of-Four Quorum Authorization</text>
<polygon points="420,468.0 690.0,548 420,628.0 150.0,548" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420" y="535.4" font-size="14" text-anchor="middle" fill="#000">Are at least three eligible</text>
<text x="420" y="552.9" font-size="14" text-anchor="middle" fill="#000">agents authorizing</text>
<text x="420" y="570.4" font-size="14" text-anchor="middle" fill="#000">the same action?</text>
<text x="705" y="540" font-size="13" text-anchor="start" fill="#000" font-weight="bold">NO</text>
<rect x="800" y="518" width="360" height="60" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="980.0" y="553.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Protective Action Withheld</text>
<text x="432" y="650" font-size="13" text-anchor="start" fill="#000" font-weight="bold">YES</text>
<rect x="179.0" y="696" width="232" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="295.0" y="726.9" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Start Forensic Snapshot</text>
<rect x="429.0" y="696" width="232" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="545.0" y="718.1" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Apply NetworkPolicy</text>
<text x="545.0" y="735.6" font-size="14" text-anchor="middle" fill="#000" font-weight="bold">Isolation</text>
<text x="675.0" y="710" font-size="12" text-anchor="start" fill="#000" font-style="italic">started concurrently after quorum</text>
<text x="675.0" y="770" font-size="12" text-anchor="start" fill="#000" font-style="italic">replacement waits for confirmed isolation</text>
<text x="675.0" y="786" font-size="12" text-anchor="start" fill="#000" font-style="italic">and snapshot completion (snapshot wait capped at 15 s;</text>
<text x="675.0" y="802" font-size="12" text-anchor="start" fill="#000" font-style="italic">capture then continues in the background)</text>
<rect x="180.0" y="808" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="829.9" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Replace Workload</text>
<text x="420.0" y="848.6" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Using Known-Good Container Image</text>
<rect x="180.0" y="896" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="927.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Perform Recovery Validation</text>
<polygon points="420,982.0 630.0,1047 420,1112.0 210.0,1047" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420" y="1042.9" font-size="15" text-anchor="middle" fill="#000">Validation Passed?</text>
<text x="420" y="1061.6" font-size="15" text-anchor="middle" fill="#000">(Three-of-Four Quorum)</text>
<text x="642" y="1039" font-size="13" text-anchor="start" fill="#000" font-weight="bold">NO</text>
<text x="642" y="1063" font-size="11" text-anchor="start" fill="#000" font-style="italic">failure persists &gt; 90 s</text>
<rect x="800" y="1011" width="380" height="72" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="990.0" y="1042.9" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Quorum-Authorized Retry Recovery</text>
<text x="990.0" y="1061.6" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">(Maximum Three Retries)</text>
<text x="1000.0" y="922.5" font-size="12" text-anchor="start" fill="#000" font-style="italic">retry: replace again</text>
<text x="1000.0" y="1119" font-size="12" text-anchor="start" fill="#000" font-style="italic">retries exhausted</text>
<rect x="800" y="1143" width="380" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="990.0" y="1174.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Needs Attention</text>
<text x="432" y="1133" font-size="13" text-anchor="start" fill="#000" font-weight="bold">YES</text>
<text x="185" y="1225" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Staged reintegration: each stage is entered only after its own three-of-four quorum</text>
<rect x="40" y="1237" width="215" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="147.5" y="1271" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">QUARANTINE</text>
<text x="147.5" y="1295" font-size="12.5" text-anchor="middle" fill="#000">Workload trust to enter: 0</text>
<rect x="303" y="1237" width="215" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="410.5" y="1271" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">RESTRICTED</text>
<text x="410.5" y="1295" font-size="12.5" text-anchor="middle" fill="#000">Workload trust to enter: 20</text>
<text x="279.0" y="1271" font-size="11" text-anchor="middle" fill="#000" font-style="italic">3-of-4</text>
<rect x="566" y="1237" width="215" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="673.5" y="1271" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">MONITORED</text>
<text x="673.5" y="1295" font-size="12.5" text-anchor="middle" fill="#000">Workload trust to enter: 40</text>
<text x="542.0" y="1271" font-size="11" text-anchor="middle" fill="#000" font-style="italic">3-of-4</text>
<rect x="829" y="1237" width="215" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="936.5" y="1271" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">PEER_VALIDATED</text>
<text x="936.5" y="1295" font-size="12.5" text-anchor="middle" fill="#000">Workload trust to enter: 60</text>
<text x="805.0" y="1271" font-size="11" text-anchor="middle" fill="#000" font-style="italic">3-of-4</text>
<rect x="1092" y="1237" width="215" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="1199.5" y="1271" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">FULL</text>
<text x="1199.5" y="1295" font-size="12.5" text-anchor="middle" fill="#000">Workload trust to enter: 80</text>
<text x="1068.0" y="1271" font-size="11" text-anchor="middle" fill="#000" font-style="italic">3-of-4</text>
<text x="675" y="1351" font-size="13" text-anchor="middle" fill="#000" font-weight="bold">Workload Trust Required to Enter: 0, 20, 40, 60, 80</text>
<text x="675" y="1371" font-size="12.5" text-anchor="middle" fill="#000" font-style="italic">Each transition: separate three-of-four quorum, at least 10 s in the current stage, local anomaly confidence below 0.3.</text>
<rect x="1049.5" y="1397" width="300" height="66" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="1199.5" y="1423" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Healthy Workload Operation</text>
<text x="1199.5" y="1445" font-size="11" text-anchor="middle" fill="#000" font-style="italic">after the cluster confirms the isolation policy is removed</text>
