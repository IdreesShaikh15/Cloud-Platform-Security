<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1497" viewBox="0 0 1350 1497" font-family="Arial, Helvetica, FreeSans, 'Liberation Sans', sans-serif">
<title>Fig. 2 Containment and recovery workflow</title>
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>

<rect x="180.0" y="24" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="55.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Suspicious Workload Detected</text>
<rect x="180.0" y="112" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="143.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Generate Security Evidence</text>
<rect x="180.0" y="200" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="231.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Authenticate Evidence Using Ed25519</text>
<rect x="180.0" y="288" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="319.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Trust-Weighted Evidence Correlation</text>
<rect x="180.0" y="376" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="407.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Three-of-Four Quorum Authorization</text>
<polygon points="420,468.0 690.0,548 420,628.0 150.0,548" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420" y="535.4" font-size="14" text-anchor="middle" fill="#000">Are at least three eligible</text>
<text x="420" y="552.9" font-size="14" text-anchor="middle" fill="#000">agents authorizing</text>
<text x="420" y="570.4" font-size="14" text-anchor="middle" fill="#000">the same action?</text>
<text x="705" y="540" font-size="13" text-anchor="start" fill="#000" font-weight="bold">NO</text>
<rect x="800" y="518" width="360" height="60" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="980.0" y="553.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Protective Action Withheld</text>
<text x="432" y="650" font-size="13" text-anchor="start" fill="#000" font-weight="bold">YES</text>
<rect x="180.0" y="690" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="721.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Preserve Forensic Evidence</text>
<rect x="180.0" y="778" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="799.9" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Isolate Workload</text>
<text x="420.0" y="818.6" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Using Kubernetes NetworkPolicy</text>
<rect x="180.0" y="866" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="887.9" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Replace Workload</text>
<text x="420.0" y="906.6" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Using Known-Good Container Image</text>
<rect x="180.0" y="954" width="480" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420.0" y="985.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Perform Recovery Validation</text>
<polygon points="420,1040.0 600.0,1100 420,1160.0 240.0,1100" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="420" y="1095.9" font-size="15" text-anchor="middle" fill="#000">Validation</text>
<text x="420" y="1114.6" font-size="15" text-anchor="middle" fill="#000">Successful?</text>
<text x="615" y="1092" font-size="13" text-anchor="start" fill="#000" font-weight="bold">NO</text>
<rect x="800" y="1066" width="380" height="68" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="990.0" y="1095.9" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Retry Recovery</text>
<text x="990.0" y="1114.6" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">(Maximum Three Attempts)</text>
<text x="1000.0" y="979.0" font-size="12" text-anchor="start" fill="#000" font-style="italic">retry</text>
<text x="1000.0" y="1170" font-size="12" text-anchor="start" fill="#000" font-style="italic">retries exhausted</text>
<rect x="800" y="1194" width="380" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="990.0" y="1225.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Needs Attention</text>
<text x="432" y="1178" font-size="13" text-anchor="start" fill="#000" font-weight="bold">YES</text>
<text x="190" y="1210" font-size="1" text-anchor="middle" fill="#000"></text>
<text x="185" y="1272" font-size="14" text-anchor="start" fill="#000" font-weight="bold">Staged reintegration (workload-trust milestones)</text>
<rect x="40" y="1282" width="230" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="155.0" y="1316" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">QUARANTINE</text>
<text x="155.0" y="1340" font-size="12.5" text-anchor="middle" fill="#000">Workload-trust milestone: 0</text>
<rect x="300" y="1282" width="230" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="415.0" y="1316" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">RESTRICTED</text>
<text x="415.0" y="1340" font-size="12.5" text-anchor="middle" fill="#000">Workload-trust milestone: 20</text>
<rect x="560" y="1282" width="230" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="675.0" y="1316" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">MONITORED</text>
<text x="675.0" y="1340" font-size="12.5" text-anchor="middle" fill="#000">Workload-trust milestone: 40</text>
<rect x="820" y="1282" width="230" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="935.0" y="1316" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">PEER_VALIDATED</text>
<text x="935.0" y="1340" font-size="12.5" text-anchor="middle" fill="#000">Workload-trust milestone: 60</text>
<rect x="1080" y="1282" width="230" height="84" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="1195.0" y="1316" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">FULL</text>
<text x="1195.0" y="1340" font-size="12.5" text-anchor="middle" fill="#000">Workload-trust milestone: 80</text>
<text x="675" y="1396" font-size="13" text-anchor="middle" fill="#000" font-style="italic">Each transition requires configured dwell time, workload-health checks, trust conditions, and authorization.</text>
<rect x="1065.0" y="1432" width="260" height="52" rx="0" fill="#fff" stroke="#000" stroke-width="1.2"/>
<text x="1195.0" y="1463.2" font-size="15" text-anchor="middle" fill="#000" font-weight="bold">Healthy Workload Operation</text>
